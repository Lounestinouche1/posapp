<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%" style="background:#0F172A; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <text x="460" y="36" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="700">ملفات الأنشطة التجارية بنقرة واحدة والحماية الذكية للإعدادات</text>
  <text x="460" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">قم بتحويل كامل سلوك نقطة البيع بلمسة واحدة مع الحفظ التلقائي لإعداداتك الخاصة</text>

  <!-- TOP CARD: MY CUSTOMIZED SETUP (SAFEGUARD) -->
  <g transform="translate(40, 80)">
    <rect width="840" height="88" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="2" filter="url(#boxShadow)"/>
    <rect x="2" y="2" width="6" height="84" rx="2" fill="#3B82F6"/>
    <text x="24" y="36" fill="#FBBF24" font-size="22">★</text>
    <text x="56" y="34" fill="#F8FAFC" font-size="15" font-weight="700">إعداداتي المخصصة</text>
    <rect x="235" y="19" width="64" height="20" rx="4" fill="#2563EB"/>
    <text x="267" y="33" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">نشط</text>
    <text x="56" y="56" fill="#94A3B8" font-size="12">تكوينك الشخصي المخصص. أي تعديل في الإعدادات يتم حفظه تلقائياً هنا.</text>
    <text x="56" y="74" fill="#34D399" font-size="11" font-weight="600">✔ التكوين المخصص قيد الاستخدام — استرجاع بنقرة واحدة متاح إذا ضغطت قالباً بالخطأ.</text>

    <!-- Buttons -->
    <rect x="610" y="26" width="100" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="660" y="49" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="600">استعادة التكوين</text>

    <rect x="720" y="26" width="100" height="36" rx="6" fill="#2563EB"/>
    <text x="770" y="49" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">حفظ الحالي</text>
  </g>

  <!-- 6 PRESET BUSINESS PROFILES (GRID: 3 COLUMNS x 2 ROWS) -->
  
  <!-- 1. Supermarket -->
  <g transform="translate(40, 185)">
    <rect width="265" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="20" y="36" fill="#F8FAFC" font-size="18">🛒</text>
    <text x="48" y="34" fill="#F8FAFC" font-size="13" font-weight="700">سوبرماركت وبقالة</text>
    <text x="20" y="58" fill="#94A3B8" font-size="11">أولوية قارئ الباركود، موازين الوزن EAN-13، وقراءة سريعة متعددة.</text>
    <text x="20" y="96" fill="#38BDF8" font-size="11" font-weight="600">← تفعيل القالب</text>
  </g>

  <!-- 2. Boutique -->
  <g transform="translate(325, 185)">
    <rect width="265" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="20" y="36" fill="#F8FAFC" font-size="18">👗</text>
    <text x="48" y="34" fill="#F8FAFC" font-size="13" font-weight="700">محلات الملابس والأزياء</text>
    <text x="20" y="58" fill="#94A3B8" font-size="11">مصفوفة المقاسات والألوان، نقاط الولاء للزبائن، وبطاقات الهدايا.</text>
    <text x="20" y="96" fill="#38BDF8" font-size="11" font-weight="600">← تفعيل القالب</text>
  </g>

  <!-- 3. Café & Bakery -->
  <g transform="translate(615, 185)">
    <rect width="265" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="20" y="36" fill="#F8FAFC" font-size="18">☕</text>
    <text x="48" y="34" fill="#F8FAFC" font-size="13" font-weight="700">مقهى ومخبزة</text>
    <text x="20" y="58" fill="#94A3B8" font-size="11">مبيعات الكاونتر السريعة، تتبع دفعات الإنتاج، والعروض المجمعة.</text>
    <text x="20" y="96" fill="#38BDF8" font-size="11" font-weight="600">← تفعيل القالب</text>
  </g>

  <!-- 4. Restaurant -->
  <g transform="translate(40, 310)">
    <rect width="265" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="20" y="36" fill="#F8FAFC" font-size="18">🍽️</text>
    <text x="48" y="34" fill="#F8FAFC" font-size="13" font-weight="700">مطاعم وصالات تقديم الطعام</text>
    <text x="20" y="58" fill="#94A3B8" font-size="11">مخطط الصالات، نقل الطاولات، طلب أطباق المطبخ، وأجهزة لوحية للنوادل.</text>
    <text x="20" y="96" fill="#38BDF8" font-size="11" font-weight="600">← تفعيل القالب</text>
  </g>

  <!-- 5. Pizzeria & Fast Food -->
  <g transform="translate(325, 310)">
    <rect width="265" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="20" y="36" fill="#F8FAFC" font-size="18">🍕</text>
    <text x="48" y="34" fill="#F8FAFC" font-size="13" font-weight="700">بيتزا ووجبات سريعة</text>
    <text x="20" y="58" fill="#94A3B8" font-size="11">إضافات نصف ونصف، أرقام انتظار الزبائن، ومتابعة مناديب التوصيل.</text>
    <text x="20" y="96" fill="#38BDF8" font-size="11" font-weight="600">← تفعيل القالب</text>
  </g>

  <!-- 6. Pharmacy -->
  <g transform="translate(615, 310)">
    <rect width="265" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="20" y="36" fill="#F8FAFC" font-size="18">💊</text>
    <text x="48" y="34" fill="#F8FAFC" font-size="13" font-weight="700">صيدليات ومستلزمات صحية</text>
    <text x="20" y="58" fill="#94A3B8" font-size="11">تتبع التشغيلات وتواريخ الصلاحية، تجزئة العبوات، وحسابات التأمين.</text>
    <text x="20" y="96" fill="#38BDF8" font-size="11" font-weight="600">← تفعيل القالب</text>
  </g>
</svg>